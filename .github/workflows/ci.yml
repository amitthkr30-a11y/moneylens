name: CI / Deploy

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts || echo "No runtime dependencies (vendored)"
      - name: Lint & type/syntax check
        run: npm run lint
      - name: Secret & real-statement scan
        run: npm run check-secrets
      - name: Unit + integration tests
        run: npm test
      - name: Build static site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest css js vendor public samples _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: _site

  deploy:
    # Only runs when every check above passed, and only from main.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
