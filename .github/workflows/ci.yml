name: CI
# Checks on every push. The site is published by GitHub Pages ("Deploy from a branch" → main → /root).
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run check-secrets
      - run: npm test
